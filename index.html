<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Побег из лаборатории</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700;900&display=swap">
<style>
/* Layout: игровая оболочка — липкая панель HUD сверху и одна сцена под ней, которая меняет экраны (заставка, карта, отсек, финал).
   Единый тёмный «лабораторный» вид выбран намеренно: бирюзовый = ИСТИНА (1), коралловый = ЛОЖЬ (0), жёлтый = управление, красный = тревога. */
:root{
  --ink:#0a1120;      /* фон станции */
  --hull:#111b2d;     /* панели */
  --hull-2:#18243a;   /* кнопки, вложенные панели */
  --seam:#28385a;     /* швы и рамки */
  --text:#e4ecf7;
  --dim:#8d9db9;
  --true:#36e2c4;     /* 1 — истина */
  --false:#ff8b5e;    /* 0 — ложь */
  --signal:#ffd23f;   /* управление, энергия, звёзды */
  --alarm:#ff4a5d;    /* тревога */
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background-color:var(--ink);color:var(--text);
  font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:
    linear-gradient(color-mix(in srgb,var(--seam) 30%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--seam) 30%,transparent) 1px,transparent 1px);
  background-size:36px 36px;background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
#app{max-width:1120px;margin:0 auto;padding-block:14px 56px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--text);background:var(--ink);border:2px solid var(--seam);border-radius:10px;padding:12px 14px;width:100%}
input:focus,textarea:focus{border-color:var(--signal);outline:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;font-weight:700}
h2{font-size:clamp(22px,3.2vw,30px)}
h3{font-size:18px}
p{margin:0}
blockquote{margin:6px 0 0;padding:12px 16px;border-left:4px solid var(--signal);background:var(--ink);border-radius:0 10px 10px 0;font-size:18px}
.mono{font-family:var(--f-mono)}
.dim{color:var(--dim)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--hull);border:1px solid var(--seam);border-radius:16px;padding:20px;min-width:0}
.hazard{height:10px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--signal) 0 12px,var(--ink) 12px 24px)}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:2px solid var(--seam);background:var(--hull-2);font-weight:600;line-height:1.2;transition:transform .08s,border-color .15s,background-color .15s;text-align:center}
.btn:hover{border-color:var(--signal)}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--seam);background:var(--hull-2);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700}
.icon-btn:hover{border-color:var(--signal)}

/* биты и выражения */
.bit{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .3em;border-radius:6px;font-family:var(--f-mono);font-weight:700;font-size:.92em;line-height:1;vertical-align:baseline}
.bit.b1{background:color-mix(in srgb,var(--true) 18%,transparent);color:var(--true)}
.bit.b0{background:color-mix(in srgb,var(--false) 18%,transparent);color:var(--false)}
.bit.bq{background:var(--hull-2);color:var(--dim)}
.expr{font-family:var(--f-mono);font-weight:700;padding:1px 8px;border-radius:6px;background:var(--ink);border:1px solid var(--seam);display:inline-block;line-height:1.6}
.expr .op{color:var(--signal);font-weight:700}
.expr .var{font-style:normal;color:var(--text)}
.op-name{color:var(--signal);font-family:var(--f-mono);font-weight:700}

/* HUD */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;background:color-mix(in srgb,var(--hull) 94%,transparent);border:1px solid var(--seam);border-radius:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(6px)}
.hud-who{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.hud-who .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.hud-who .rk{font-size:12px;color:var(--signal);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:52px}
.stat b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.stat.combo b{color:var(--signal)}
.hud-btns{display:flex;gap:8px}
@media (max-width:640px){
  #hud{gap:8px 12px}
  .hud-who svg{display:none}
  .stat b{font-size:16px}
  .hud-who{flex-basis:100%}
  .stat{min-width:0}
  .stat.st-stars{display:none}
  .hud-btns{margin-left:auto}
  .icon-btn{width:38px;height:38px}
}

/* заставка */
.title{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding-block:28px}
.logo{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,6.4vw,70px);line-height:1;letter-spacing:-.01em;text-transform:uppercase}
.logo span{display:block}
.logo .l2{color:var(--signal)}
.title-art{display:grid;place-items:center;position:relative;padding:24px}
.title-art .glow{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--true) 22%,transparent),transparent 65%)}
.title-art .float{position:relative;width:min(260px,70%)}
.title-art .robot{width:100%;height:auto}
.rules-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rules-mini div{padding:12px;border:1px solid var(--seam);border-radius:12px;background:var(--hull);font-size:14px}
.rules-mini b{display:block;font-family:var(--f-mono);color:var(--signal);font-size:20px}
.form2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.form2 label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.confirm{padding:14px;border:1px solid var(--alarm);border-radius:12px;background:color-mix(in srgb,var(--alarm) 8%,var(--hull))}
@media (max-width:760px){.title{grid-template-columns:1fr}.title-art{order:-1;padding:0}.title-art .float{width:150px}.rules-mini{grid-template-columns:1fr}.form2{grid-template-columns:1fr}}

/* робот */
.robot{display:block}
.robot .ant{animation:blink 1.6s steps(1) infinite}
.robot.alarm .ant{animation-duration:.4s}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{50%{opacity:.25}}

/* диалог */
.dialog{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:end;max-width:860px;margin:0 auto;width:100%;padding-block:24px}
.speaker{width:120px;display:grid;place-items:center}
.bubble{position:relative;padding:22px;border-radius:16px;background:var(--hull);border:2px solid var(--seam);min-height:150px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.bubble.sys{border-color:var(--alarm)}
.bubble.logos{border-color:var(--true)}
.bubble .who{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.bubble.sys .who{color:var(--alarm)} .bubble.logos .who{color:var(--true)} .bubble.bit .who{color:var(--signal)}
.bubble .txt{font-size:19px;min-height:3em}
.logos-core{width:110px;height:110px;border-radius:50%;border:3px solid var(--true);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;color:var(--true);box-shadow:0 0 30px color-mix(in srgb,var(--true) 40%,transparent),inset 0 0 30px color-mix(in srgb,var(--true) 25%,transparent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 10px color-mix(in srgb,var(--true) 30%,transparent),inset 0 0 14px color-mix(in srgb,var(--true) 15%,transparent)}}
@media (max-width:600px){.dialog{grid-template-columns:1fr}.speaker{width:auto}.logos-core{width:76px;height:76px}}

/* карта */
.map-head{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
.progress{height:12px;border-radius:999px;background:var(--hull-2);border:1px solid var(--seam);overflow:hidden;min-width:180px;flex:1}
.progress i{display:block;height:100%;background:var(--true);border-radius:999px;transition:width .6s}
.progress.rank i{background:var(--signal)}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:none}
.node{position:relative;text-align:left;padding:16px;border-radius:14px;border:2px solid var(--seam);background:var(--hull);display:flex;flex-direction:column;gap:8px;min-height:168px;transition:transform .12s,border-color .15s}
.node:not(.locked):hover{transform:translateY(-3px)}
.node .code{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--dim)}
.node h3{font-size:17px}
.node .sub{font-size:14px;color:var(--dim)}
.node .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--seam);white-space:nowrap}
.node.avail{border-color:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 14%,transparent)}
.node.avail .chip{color:var(--ink);background:var(--signal);border-color:var(--signal)}
.node.done{border-color:color-mix(in srgb,var(--true) 55%,var(--seam))}
.node.done .chip{color:var(--true);border-color:var(--true)}
.node.locked{opacity:.5;cursor:not-allowed}
.node.boss{background:linear-gradient(160deg,color-mix(in srgb,var(--alarm) 10%,var(--hull)),var(--hull))}
.node .here{position:absolute;right:10px;top:-34px;width:46px}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.star path{fill:var(--seam)} .star.on path{fill:var(--signal)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--seam);background:var(--hull-2);font-size:13px;min-width:0}
.ach .ic{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--ink);border:1px solid var(--seam);font-family:var(--f-mono);font-weight:700;color:var(--dim)}
.ach b{display:block;font-size:14px}
.ach.got{border-color:var(--signal)}
.ach.got .ic{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.ach:not(.got){opacity:.6}
@media (max-width:820px){.map{grid-template-columns:repeat(2,1fr)}}
@media (max-width:500px){.map{grid-template-columns:1fr}.node{min-height:0}}

/* отсек */
.sec-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{padding:8px 14px;border-radius:999px;border:1px solid var(--seam);background:var(--hull);font-family:var(--f-mono);font-size:13px}
.stepper button:hover{border-color:var(--signal)}
.stepper .cur{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.stepper .done-step::before{content:"✓ ";color:var(--true)}
.practice{font-family:var(--f-mono);font-size:12px;color:var(--true);border:1px dashed var(--true);padding:4px 10px;border-radius:999px}
.terminal{background:var(--ink);border:1px solid var(--seam);border-radius:16px;overflow:hidden}
.terminal-bar{display:flex;gap:10px;align-items:center;padding:9px 16px;background:var(--hull-2);font-family:var(--f-mono);font-size:12px;color:var(--dim);border-bottom:1px solid var(--seam)}
.terminal-bar i{width:10px;height:10px;border-radius:50%;background:var(--seam);display:inline-block}
.terminal-bar i:first-child{background:var(--alarm)}
.terminal-body{padding:22px;display:flex;flex-direction:column;gap:16px}
.terminal-body > *{max-width:72ch}
.terminal-body .wide{max-width:none}
.rule{padding:12px 16px;border-radius:10px;border:1px solid var(--signal);background:color-mix(in srgb,var(--signal) 7%,transparent)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols2 > div{padding:14px;border-radius:12px;border:1px solid var(--seam);background:var(--hull);min-width:0}
.cols2 h3{font-size:14px;margin-bottom:6px}
.cols2 ul{margin:0;padding-left:18px}
.life{padding:12px 16px;border-left:4px solid var(--true);background:var(--hull);border-radius:0 10px 10px 0}
.notation{display:flex;flex-wrap:wrap;gap:8px}
.notation span{font-family:var(--f-mono);padding:4px 10px;border:1px solid var(--seam);border-radius:8px;background:var(--hull)}
@media (max-width:640px){.cols2{grid-template-columns:1fr}.terminal-body{padding:16px}}

/* таблицы истинности */
.tt-wrap{overflow-x:auto;max-width:100%}
.tt{border-collapse:collapse;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tt th,.tt td{border:1px solid var(--seam);padding:6px 12px;text-align:center;white-space:nowrap}
.tt th{background:var(--hull-2);font-size:13px}
.tt th .expr{background:transparent;border:0;padding:0}
.tt th.fin{background:color-mix(in srgb,var(--signal) 14%,var(--hull-2))}
.tt tr.cur td{background:color-mix(in srgb,var(--signal) 12%,transparent)}
.tt td.ok{color:var(--true)}

/* симулятор */
.sim{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.sim-out{display:flex;align-items:center;gap:18px;padding:18px;border-radius:14px;border:1px solid var(--seam);background:var(--ink)}
.biglamp{flex:none;width:84px;height:84px;border-radius:50%;background:var(--hull-2);border:4px solid var(--seam);transition:background-color .2s,box-shadow .2s,border-color .2s;position:relative}
.biglamp::after{content:"";position:absolute;inset:18%;border-radius:50%;border:3px dashed color-mix(in srgb,var(--seam) 80%,transparent)}
.biglamp.on{background:var(--true);border-color:var(--true);box-shadow:0 0 40px var(--true),0 0 90px color-mix(in srgb,var(--true) 40%,transparent)}
.biglamp.on::after{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.switches{display:flex;gap:12px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 14px;border-radius:12px;border:2px solid var(--seam);background:var(--hull-2);min-width:84px;max-width:170px}
.sw:hover{border-color:var(--signal)}
.sw .vn{font-family:var(--f-mono);font-weight:700;font-size:20px}
.sw .lg{font-size:12px;color:var(--dim);text-align:center;line-height:1.3}
.knob{width:52px;height:28px;border-radius:999px;background:var(--ink);border:2px solid var(--seam);position:relative}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--false);transition:left .15s}
.sw.on .knob::after{left:27px;background:var(--true)}
.sw[disabled]{opacity:.6;cursor:default}
.scan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scan{text-align:left;padding:14px;border-radius:12px;border:2px dashed var(--seam);background:var(--hull-2);display:flex;flex-direction:column;gap:8px;min-height:120px}
.scan:hover{border-color:var(--signal)}
.scan .s{font-size:17px}
.scan .res{margin-top:auto;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.scan.rev{border-style:solid;cursor:default}
.scan.kT{border-color:var(--true)} .scan.kT .res{color:var(--true)}
.scan.kF{border-color:var(--false)} .scan.kF .res{color:var(--false)}
.scan.kN{border-color:var(--dim)} .scan.kN .res{color:var(--dim)}
.scan .why{font-size:13px;color:var(--dim)}
.explore{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:820px){.sim{grid-template-columns:1fr}}

/* дверь */
.door-layout{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);gap:18px;align-items:start}
.door-box{display:flex;flex-direction:column;gap:14px;position:sticky;top:96px}
.door{position:relative;aspect-ratio:3/3.6;width:100%;max-width:100%;border-radius:14px;background:var(--ink);border:3px solid var(--seam);overflow:hidden}
.door-beyond{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--true) 35%,var(--ink)),var(--ink) 70%)}
.door-beyond .robot{width:34%;transition:transform 1.6s ease-in .5s}
.door.open .door-beyond .robot{transform:translateY(-6%) scale(.55);opacity:.85}
.leaf{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(180deg,var(--hull-2),var(--hull));transition:transform 1.2s cubic-bezier(.7,0,.3,1);z-index:1}
.leaf.l{left:0;border-right:2px solid var(--ink)}
.leaf.r{right:0;border-left:2px solid var(--seam)}
.leaf::before{content:"";position:absolute;left:0;right:0;top:58%;height:9%;background:repeating-linear-gradient(-45deg,var(--signal) 0 10px,var(--ink) 10px 20px);opacity:.85}
.leaf::after{content:"";position:absolute;left:14%;right:14%;top:12%;height:30%;border:2px solid var(--seam);border-radius:8px}
.door.open .leaf.l{transform:translateX(-102%)}
.door.open .leaf.r{transform:translateX(102%)}
.door-sign{position:absolute;z-index:2;bottom:10px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--dim)}
.locks{display:flex;gap:10px;justify-content:center;position:absolute;top:14%;left:0;right:0;z-index:2}
.lock{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--ink);border:3px solid var(--seam);font-family:var(--f-mono);font-weight:700;color:var(--dim);transition:all .3s}
.lock.cur{border-color:var(--signal);color:var(--signal);animation:blink 1.2s steps(1) infinite}
.lock.on{border-color:var(--true);color:var(--ink);background:var(--true);box-shadow:0 0 18px var(--true);animation:none}
.door.open .locks{opacity:0;transition:opacity .3s}
.energy{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 14px;border-radius:12px;border:1px solid var(--seam);background:var(--hull)}
.cells{display:flex;gap:4px;padding:4px;border:2px solid var(--seam);border-radius:8px;position:relative}
.cells::after{content:"";position:absolute;right:-7px;top:30%;width:4px;height:40%;background:var(--seam);border-radius:0 2px 2px 0}
.cell{width:30px;height:18px;border-radius:3px;background:var(--signal);transition:background-color .3s}
.cell.off{background:var(--hull-2)}
.energy.low .cell:not(.off){background:var(--alarm);animation:blink .8s steps(1) infinite}
.virus{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--alarm);border-radius:12px;background:color-mix(in srgb,var(--alarm) 9%,var(--hull))}
.virus-ico{flex:none;animation:glitch 2.4s infinite}
.virus .say{font-family:var(--f-mono);font-size:13px;color:var(--alarm);min-height:1.4em}
.hp{display:flex;gap:4px;margin-top:6px}

@keyframes glitch{0%,88%,100%{transform:none}90%{transform:translate(3px,-2px) skewX(8deg)}93%{transform:translate(-3px,1px)}96%{transform:translate(2px,2px) skewX(-6deg)}}
@media (max-width:820px){
  .door-layout{grid-template-columns:1fr}
  .door-box{position:static;display:grid;grid-template-columns:120px 1fr;align-items:center}
  .door{aspect-ratio:3/3.8}
  .door .lock{width:26px;height:26px;font-size:12px;border-width:2px}
  .door .locks{gap:4px}
  .door-sign{display:none}
  .door-box .virus{grid-column:1/-1}
}

/* задание */
.task{display:flex;flex-direction:column;gap:16px}
.task-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;padding:4px 10px;border-radius:999px;background:var(--hull-2);border:1px solid var(--seam);color:var(--signal)}
.q{font-size:18px;line-height:1.6}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .btn{padding:18px 10px;font-size:18px;font-family:var(--f-display);font-weight:700}
.tf .t1{border-color:var(--true);color:var(--true)}
.tf .t0{border-color:var(--false);color:var(--false)}
.tf .t1:hover{background:color-mix(in srgb,var(--true) 12%,var(--hull-2))}
.tf .t0:hover{background:color-mix(in srgb,var(--false) 12%,var(--hull-2))}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--seam);background:var(--hull-2);font-size:16px}
.opt:hover{border-color:var(--signal)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--ink);font-family:var(--f-mono);font-weight:700;color:var(--signal)}
.opt.right{border-color:var(--true);background:color-mix(in srgb,var(--true) 12%,var(--hull-2))}
.opt[disabled]{cursor:default}
.lamps{display:grid;gap:10px}
.lamp-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--seam);border-radius:12px;background:var(--hull-2);flex-wrap:wrap}
.lampdot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);border:2px solid var(--seam);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--dim);transition:all .25s}
.lampdot.on{background:var(--true);border-color:var(--true);box-shadow:0 0 16px var(--true);color:var(--ink)}
.lampdot.off{background:var(--hull);border-color:var(--false);color:var(--false)}
.target{margin-left:auto;font-size:13px;font-family:var(--f-mono);letter-spacing:.04em}
.target.t1{color:var(--true)} .target.t0{color:var(--false)}
.lamp-row.miss{box-shadow:0 0 0 2px var(--alarm)}
.cellbtn{width:46px;height:36px;border-radius:8px;border:2px dashed var(--seam);background:var(--hull-2);font-family:var(--f-mono);font-weight:700;color:var(--dim)}
.cellbtn:hover{border-color:var(--signal)}
.cellbtn.v1{border-style:solid;color:var(--true);border-color:var(--true)}
.cellbtn.v0{border-style:solid;color:var(--false);border-color:var(--false)}
.cellbtn.err{box-shadow:0 0 0 3px var(--alarm)}
.task-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.task-foot .sp{flex:1}
.feedback{padding:14px 16px;border-radius:12px;border:1px solid var(--seam);display:flex;flex-direction:column;gap:8px}
.feedback.ok{border-color:var(--true);background:color-mix(in srgb,var(--true) 9%,transparent)}
.feedback.bad{border-color:var(--alarm);background:color-mix(in srgb,var(--alarm) 9%,transparent)}
.feedback.hint{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 7%,transparent)}
.feedback .fh{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.feedback.ok .fh{color:var(--true)} .feedback.bad .fh{color:var(--alarm)} .feedback.hint .fh{color:var(--signal)}
.steps{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.steps li{padding-left:4px}

/* модальные окна, тосты, тревога */
#modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 82%,transparent);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:60;backdrop-filter:blur(4px)}
.modal-card{max-width:600px;width:100%;max-height:calc(100vh - 32px);overflow:auto;background:var(--hull);border:2px solid var(--seam);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;animation:pop .25s ease-out}
.modal-card.alarm{border-color:var(--alarm)}
.modal-card.win{border-color:var(--true)}
.modal-card.wide{max-width:860px}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.big-stars{display:flex;gap:10px;justify-content:center}

.big-stars .star.on:nth-child(2){animation-delay:.25s}

@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}

.toast{padding:12px 14px;border-radius:12px;background:var(--hull-2);border:2px solid var(--signal);box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 70%,transparent);animation:toast 4s forwards;font-size:14px}

@keyframes toast{0%{transform:translateY(20px);opacity:0}8%,85%{transform:none;opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 50px var(--alarm);opacity:0;z-index:50}

@keyframes alarmfx{0%{opacity:0}15%{opacity:1}35%{opacity:.25}55%{opacity:.9}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.pts.plus{color:var(--true)} .pts.minus{color:var(--alarm)} .pts.bonus{color:var(--signal);font-size:20px}

.sector-stars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sector-stars div{padding:8px 4px;text-align:center;border-radius:10px;background:var(--hull-2);border:1px solid var(--seam);font-family:var(--f-mono);font-size:12px;color:var(--dim)}

.result-card{display:flex;flex-direction:column;gap:12px}

.err{color:var(--alarm)}

.info-table th,.info-table td{border:1px solid var(--seam);padding:8px 10px;text-align:left;vertical-align:top}

/* станция */
.station-wrap{border-radius:20px;border:1px solid var(--seam);background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--true) 7%,var(--ink)),var(--ink) 60%);padding:8px}
.station{display:block;width:100%;height:auto}
.station .corr{fill:var(--hull);stroke:var(--seam);stroke-width:2}
.station .corr.lit{fill:color-mix(in srgb,var(--true) 10%,var(--hull))}

.station .door-g.open .dleaf{fill:var(--true);transform:translate(var(--dx),var(--dy))}
.station .floor{fill:var(--hull);stroke:var(--seam);stroke-width:2;transition:fill .15s}
.station .room.avail .floor{stroke:var(--signal);stroke-width:3;animation:roomglow 2s ease-in-out infinite}
.station .room.done .floor{stroke:var(--true);stroke-width:2.5}
.station .room.boss .floor{fill:color-mix(in srgb,var(--alarm) 9%,var(--hull))}
.station .room.locked{opacity:.5}
.station .room[data-act]{cursor:pointer}
.station .room[data-act]:hover .floor{fill:var(--hull-2)}

.station .room.done .rcode{fill:var(--true)}

.station .gicon text{font:700 15px var(--f-mono);fill:var(--signal);text-anchor:middle}
.station .room.done .gicon rect,.station .room.done .gicon circle,.station .room.done .gicon path{stroke:var(--true)}
.station .scanline{stroke:var(--true)!important;animation:scan 2s ease-in-out infinite}
.station .padlock rect{fill:var(--hull-2);stroke:var(--dim);stroke-width:2}
.station .padlock path{fill:none;stroke:var(--dim);stroke-width:3}
.station .exitg rect{fill:var(--hull);stroke:var(--seam);stroke-width:2;stroke-dasharray:6 5}
.station .exitg text{font:700 15px var(--f-display);fill:var(--dim);text-anchor:middle;letter-spacing:.1em}
.station .exitg.open rect{fill:color-mix(in srgb,var(--true) 22%,var(--hull));stroke:var(--true);stroke-dasharray:none}
.station .exitg.open text{fill:var(--true)}
.station .shadow{fill:var(--ink);opacity:.7}
#bot.walking .bob{animation:bob .32s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes roomglow{50%{stroke:color-mix(in srgb,var(--signal) 45%,var(--seam))}}
@keyframes scan{50%{transform:translateY(20px)}}
/* логическая схема */
.circ-wrap{overflow-x:auto;max-width:100%}
.circuit{display:block;max-width:100%;height:auto}
.circuit .wire{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.circuit .w1{stroke:var(--true);stroke-dasharray:10 6;animation:flow .5s linear infinite}
.circuit .w0{stroke:var(--false);opacity:.75}
.circuit .wq{stroke:var(--dim)}
@keyframes flow{to{stroke-dashoffset:-16}}
.circuit .gate rect{fill:var(--hull-2);stroke:var(--text);stroke-width:2.5}
.circuit .gate circle{fill:var(--hull-2);stroke:var(--text);stroke-width:2.5}
.circuit .gate text{font:700 20px var(--f-mono);fill:var(--signal);text-anchor:middle}
.circuit .pin rect{fill:var(--ink);stroke:var(--seam);stroke-width:2}
.circuit .pin.tap{cursor:pointer}
.circuit .pin.tap:hover rect,.circuit .pin.tap:focus-visible rect{stroke:var(--signal)}
.circuit .pin:focus{outline:none}
.circuit .pl{font:700 17px var(--f-mono);fill:var(--text);text-anchor:middle}
.circuit .pv{font:700 17px var(--f-mono);text-anchor:middle}
.circuit .pv.v1{fill:var(--true)} .circuit .pv.v0{fill:var(--false)}
.circuit .clamp{fill:var(--hull-2);stroke:var(--seam);stroke-width:3}
.circuit .clamp.on{fill:var(--true);stroke:var(--true);filter:drop-shadow(0 0 8px var(--true))}
.circuit .clamp.off{stroke:var(--false)}
/* конструктор */
.build-line{min-height:58px;padding:12px;border-radius:12px;border:2px solid var(--seam);background:var(--ink);display:flex;align-items:center;font-size:18px}

.build-line .expr{border:0;background:transparent;font-size:20px}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.tok{min-width:52px;padding:10px 14px;border-radius:10px;border:2px solid var(--seam);background:var(--hull-2);font-family:var(--f-mono);font-weight:700;font-size:17px}
.tok:hover{border-color:var(--signal)}
.tok.to{color:var(--signal)} .tok.tx{font-family:var(--f-body);font-size:14px;color:var(--dim)}
/* ставка уверенности */
.bet{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 14px;border-radius:12px;border:1px dashed var(--seam);background:transparent;font-size:14px}

.bet:hover{border-color:var(--signal)}
.bet-knob{flex:none;width:40px;height:22px;border-radius:999px;background:var(--ink);border:2px solid var(--seam);position:relative}
.bet-knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:left .15s}
.bet.on{border-style:solid;border-color:var(--signal);background:color-mix(in srgb,var(--signal) 8%,transparent)}

/* рефлексия и аналитика */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:2px solid var(--seam);background:var(--hull-2);font-size:14px}
.chipbtn i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chipbtn:hover{border-color:var(--c)}
.chipbtn.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--hull-2))}
.heat{display:flex;gap:4px;flex-wrap:wrap}
.heat span{display:flex;flex-direction:column;align-items:center;min-width:38px;padding:4px;border-radius:8px;font-family:var(--f-mono);background:color-mix(in srgb,var(--alarm) calc(var(--a) * 70%),var(--hull-2))}
.heat b{font-size:10px;color:var(--dim)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>

function doorPt(L, d) {

function roomPath(L, a, b) {

function setBot(p) { const b = $('#bot'); if (b) b.style.transform = `translate(${p.x}px,${p.y}px)`; }
function walk(path, done) {
  const bot = $('#bot');
  if (!bot || path.length < 2 || REDUCED) { if (path.length) setBot(path[path.length - 1]); return done && done(); }
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  let total = 0; for (let i = 1; i < path.length; i++) total += dist(path[i - 1], path[i]);
  let acc = 0;
  const kf = path.map((p, i) => { if (i) acc += dist(path[i - 1], p); return { transform: `translate(${p.x}px,${p.y}px)`, offset: total ? acc / total : 1 }; });
  const dur = Math.min(4200, Math.max(700, total * 2.6));
  bot.classList.add('walking');
  const steps = setInterval(() => Snd.tone(160, .04, 'square', .02), 190);
  const anim = bot.animate(kf, { duration: dur, easing: 'ease-in-out', fill: 'forwards' });
  anim.onfinish = () => { clearInterval(steps); setBot(path[path.length - 1]); anim.cancel(); bot.classList.remove('walking'); done && done(); };
}

}
function confetti() {
  if (REDUCED) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'); cv.hidden = false;
  cv.width = innerWidth; cv.height = innerHeight;
  const css = getComputedStyle(document.documentElement), cols = ['--true', '--false', '--signal', '--text'].map(v => css.getPropertyValue(v).trim());
  const P = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, s: 5 + Math.random() * 6, r: Math.random() * 6, c: pick(cols), b: rnd(2) }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.font = `700 ${p.s * 2}px monospace`; ctx.fillText(p.b ? '1' : '0', 0, 0); ctx.restore(); });
    if (++f < 260) requestAnimationFrame(tick); else { cv.hidden = true; }
  })();
}

/* ---------- Действия ---------- */
const ACT = {
  'continue': () => { S = migrate(store.get(SAVE_KEY)); Snd.on = S.sound !== false; go(S.finishedAt ? 'finale' : 'map'); },
  'reset-ask': () => { $('#confirm-slot').innerHTML = `<div class="confirm stack" style="margin-top:12px"><b>Начать заново?</b><span class="dim">Сохранённый прогресс${S || store.get(SAVE_KEY) ? ', очки и достижения' : ''} будут удалены.</span><div class="row"><button class="btn primary" data-act="reset-yes">Да, начать заново</button><button class="btn ghost" data-act="reset-no">Отмена</button></div></div>`; },
  'reset-no': () => { $('#confirm-slot').innerHTML = ''; },
  'reset-yes': () => { store.del(SAVE_KEY); S = null; R = null; go('title'); },
  'teacher': () => go('teacher'),
  'title': () => go('title'),
  'intro-next': () => { const t = $('#intro-txt'); if (t && !t.dataset.done) { clearInterval(typer); t.textContent = INTRO[introI].text; t.dataset.done = '1'; return; } introI++; if (introI >= INTRO.length) return go('map'); drawIntro(); },
  'intro-skip': () => { clearInterval(typer); go('map'); },
  'map': () => { R = null; go('map'); },
  'rules': () => showRules(),
  'sound': () => { Snd.on = !Snd.on; if (S) { S.sound = Snd.on; save(); } hud(); },
  'open-sector': el => {
    const sid = +el.dataset.sid; if (!unlocked(sid) || walking) return;
    walking = true; Snd.click();
    walk(roomPath(curL, S.pos - 1, sid - 1), () => { walking = false; S.pos = sid; save(); enterSector(sid); });
  },
  'next-sector': () => { const n = R.sid + 1; R = null; mapPlan = { to: n }; go('map'); },
  'escape': () => { R = null; mapPlan = { to: 'exit' }; go('map'); },
  'tok': el => { const t = R.locks[R.active]; if (t.seq.length < 24) t.seq.push(el.dataset.tok); R.feedback = null; Snd.click(); renderTask(); },
  'tok-back': () => { R.locks[R.active].seq.pop(); Snd.click(); renderTask(); },
  'tok-clear': () => { R.locks[R.active].seq = []; Snd.click(); renderTask(); },
  'bet': () => { R.bet = !R.bet; Snd.tone(R.bet ? 990 : 500, .08, 'triangle', .05); renderTask(); },
  'reflect': el => { S.reflect[el.dataset.k] = el.dataset.v; save(); $('#reflect').outerHTML = reflectHTML(); $('#rcode').textContent = resultCode(); Snd.click(); },
  'speak': el => {
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); el.textContent = '▶ Озвучить теорию'; return; }
    const box = $('.terminal-body').cloneNode(true); $$('.tt-wrap,.row,.circ-wrap,.notation', box).forEach(x => x.remove());
    const u = new SpeechSynthesisUtterance(box.textContent.replace(/\s+/g, ' ').trim()); u.lang = 'ru-RU'; u.rate = 1;
    const ru = speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang)); if (ru) u.voice = ru;
    u.onend = () => { el.textContent = '▶ Озвучить теорию'; };
    speechSynthesis.speak(u); el.textContent = '■ Остановить';
  },
  'phase': el => { if ('speechSynthesis' in window) speechSynthesis.cancel(); R.phase = el.dataset.phase; R.feedback = null; renderSector(); },
  'scan': el => { const i = +el.dataset.i; if (R.revealed.has(i)) return; R.revealed.add(i); const k = R.scan[i].k; Snd.tone(k === 'T' ? 880 : k === 'F' ? 330 : 520, .12, 'triangle', .05); renderSim(); checkExplored($$('.scan')[i]); },
  'sim-toggle': el => { const v = el.dataset.var; R.simEnv[v] ^= 1; R.visited.add(envKey(R.simEnv)); Snd.click(); renderSim(); checkExplored($(`[data-act="sim-toggle"][data-var="${v}"]`)); },
  'tf': el => answer((el.dataset.v === '1') === R.locks[R.active].answer, el),
  'opt': el => answer(+el.dataset.i === R.locks[R.active].answer, el),
  'sw': el => { const t = R.locks[R.active]; t.env[el.dataset.var] ^= 1; t.shown = null; Snd.click(); renderTask(); },
  'cell': el => { const t = R.locks[R.active], r = +el.dataset.r, c = +el.dataset.c, v = t.fill[r][c]; t.fill[r][c] = v === null ? 1 : v === 1 ? 0 : 1; if (t.errs) t.errs.delete(r + ':' + c); Snd.click(); renderTask(); },
  'check': el => {
    const t = R.locks[R.active];
    if (t.type === 'build') {
      if (!t.seq.length) { R.feedback = { cls: 'hint', title: 'Выражение пустое', html: 'Собери выражение из блоков, потом нажми «Проверить». Энергия не потрачена.' }; return renderTask(); }
      try { parse(t.seq.join(' ')); } catch (e) { R.feedback = { cls: 'hint', title: 'Ошибка записи', html: 'Выражение записано не по правилам: не хватает переменной, операции или скобки. Энергия не потрачена, исправь запись.' }; return renderTask(); }
      const ok = combos(t.vars).every(e => value(t.seq.join(' '), e) === value(t.src, e));
      return answer(ok, el);
    }
    if (t.type === 'switch') { if (t.sat(t.env)) { t.shown = { ...t.env }; } answer(t.sat(t.env), el); }
    else if (t.type === 'table') {
      if (t.fill.some(row => row.some(v => v === null))) { R.feedback = { cls: 'hint', title: 'Таблица не заполнена', html: 'Заполни все клетки, потом нажми «Проверить». Энергия не потрачена.' }; return renderTask(); }
      const ok = t.rows.every((env, r) => { const vals = rowVals(t.src, env); return t.cols.every((c, ci) => t.fill[r][ci] === vals[c]); });
      answer(ok, el);
    }
  },
  'hint': el => { const t = R.locks[R.active]; if (t.hintShown) return; t.hintShown = true; R.hints++; if (!R.practice) S.hints++; addScore(-20, el); Snd.tone(440, .15, 'triangle', .05); renderTask(); },
  'next-lock': () => { R.bet = false; R.active = R.opened.findIndex(o => !o); R.solved = false; R.feedback = null; renderDoorBox(); renderTask(); },

  'finale': () => { R = null; go('finale'); },
  'copy-code': el => {

    try { navigator.clipboard.writeText(code).then(() => { el.textContent = 'Скопировано'; }, fallback); } catch (e) { fallback(); }
  },
  'decode': () => {
    const d = decodeCode($('#t-code').value), out = $('#t-out');
    if (d.err) { out.innerHTML = `<p class="err">${d.err}</p>`; return; }
    const tot = d.stars.reduce((a, b) => a + b, 0), ov = tot >= 16 ? 3 : tot >= 11 ? 2 : 1;
    out.innerHTML = `<div class="result-card"><div class="row" style="justify-content:space-between"><h3>${esc(d.name)}${d.cls ? ', ' + esc(d.cls) : ''}</h3>${starsHTML(ov)}</div>
      <table><tbody>
        <tr><td>Дата прохождения</td><td class="mono">${esc(d.date)}</td></tr>
        <tr><td>Очки</td><td class="mono">${d.score}</td></tr>
        <tr><td>Ранг</td><td>${rankOf(d.score).name}</td></tr>
        <tr><td>Ошибки / подсказки</td><td class="mono">${d.errors} / ${d.hints}</td></tr>
        <tr><td>Время</td><td class="mono">${fmtTime(d.elapsed)}</td></tr>
        <tr><td>Звёзды по отсекам</td><td>${d.stars.map((s, i) => `<span class="mono dim">${i + 1}:</span>${starsHTML(s)}`).join(' ')}</td></tr>
        <tr><td>Всего звёзд</td><td class="mono">${tot}/18</td></tr>
        <tr><td>Лучшая серия / достижения</td><td class="mono">×${d.best} / ${d.ach} из ${ACH.length}</td></tr>
        ${d.secErr ? `<tr><td>Ошибки по отсекам (карта трудностей)</td><td><div class="heat">${d.secErr.map((e, i) => `<span style="--a:${Math.min(1, e / 4)}" title="Отсек ${i + 1}: ${SECTORS[i].name}"><b>${i + 1}</b>${e}</span>`).join('')}</div></td></tr>
        <tr><td>Ставки уверенности</td><td class="mono">${d.confN ? `${d.confOk} из ${d.confN} верно (${Math.round(d.confOk / d.confN * 100)}%)` : 'не делал'}</td></tr>
        <tr><td>Самооценка</td><td>${d.mood && MOODS[d.mood] ? `<span style="color:${MOODS[d.mood][1]}">●</span> ${MOODS[d.mood][0]}` : 'не указана'}</td></tr>
        <tr><td>Самый трудный отсек (по мнению ученика)</td><td>${TOPIC_NAME(d.topic)}</td></tr>` : ''}

  },

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.closest('#modal') === null && !$('#modal').hidden) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.bubble[data-act]')) { e.preventDefault(); ACT['intro-next'](); }
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('svg [data-act]')) { e.preventDefault(); const f = ACT[e.target.dataset.act]; if (f) f(e.target, e); }
});

const RENDER = { title: renderTitle, intro: renderIntro, map: renderMap, sector: renderSector, finale: renderFinale, teacher: renderTeacher };

/* ---------- Запуск ---------- */
function start(data) {
  if (data && data.S) { S = migrate(data.S); Snd.on = S.sound !== false; go(S.finishedAt ? 'finale' : 'map'); }
  else go('title');
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
